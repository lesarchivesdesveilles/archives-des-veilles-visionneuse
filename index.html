
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie — Les Archives des Veilles</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #171119;
  color: #f5e5cb;
  font-family: Arial, sans-serif;
}

.gallery {
  max-width: 760px;
  margin: auto;
  padding: 12px 10px 18px;
}

/* Navigation principale */
.nav {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  margin-bottom: 10px;
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 18px;
}

.nav button,
.close,
.modal-nav,
.reset-button {
  background: #30222e;
  color: #e8bb7e;
  border: 1px solid #94704e;
  border-radius: 8px;
  cursor: pointer;
}

.nav button {
  width: 44p;
  height: 42p;
  font-size: 22p;
}

button:disabled {
  opacity: .35;
  cursor: default;
}

.counter {
  min-width: 62p;
  tet-align: center;
  font-size: 14p;
}

/* Petite croi de retour vers Notion */
.return-close {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: fle;
  align-items: center;
  justify-content: center;
  width: 32p;
  height: 32p;
  background: #30222e;
  color: #e8bb7e;
  border: 1p solid #94704e;
  border-radius: 8p;
  tet-decoration: none;
  font-size: 20p;
  line-height: 1;
}

/* Petites croi discrètes */
.return-close,
.modal-top .close {
  width: 26p;
  height: 26p;
  font-size: 16p;
  border-radius: 6p;
  padding: 0;
}

/* Contour harmonisé de la croi */
.modal-top .close {
  border: 1p solid #94704e;
  outline: none;
  bo-shadow: none;
}

.modal-top .close:focus-visible {
  outline: 1p solid #e8bb7e;
  outline-offset: 1p;
}

.main-image {
  display: block;
  width: 100%;
  height: auto;
  border: 1p solid #70533e;
  border-radius: 9p;
  cursor: zoom-in;
  user-select: none;
  -webkit-user-drag: none;
  touch-action: pan-y;
}

.hint {
  tet-align: center;
  color: #b59b86;
  font-size: 12px;
  margin: 8px 0;
}

#loadStatus[hidden] {
  display: none;
}

.thumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 2px;
  scrollbar-width: thin;
}

.thumb {
  flex: none;
  width: 56px;
  height: 78px;
  padding: 2px;
  border: 1px solid #70533e;
  border-radius: 6px;
  background: #241a25;
  opacity: .65;
  cursor: pointer;
}

.thumb[aria-current="true"] {
  border: 2px solid #e8bb7e;
  opacity: 1;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Vue agrandie */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(7,5,9,.97);
  z-index: 1000;
  display: none;
  flex-direction: column;
  align-items: center;
}

.modal.open {
  display: flex;
}

.modal-top {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
}

#modalCounter {
  justify-self: start;
}

/* Réinitialisation du zoom */
.reset-button {
  grid-column: 2;
  justify-self: center;
  width: 36px;
  height: 36px;
  font-size: 22px;
  line-height: 1;
}

/* Croix identique à celle de la galerie */
.modal-top .close {
  grid-column: 3;
  justify-self: end;
  width: 26px;
  height: 26px;
  font-size: 16px;
  line-height: 1;
  padding: 0;
  border: 1px solid #94704e;
  border-radius: 6px;
  background: #30222e;
  color: #e8bb7e;
  outline: none;
  box-shadow: none;
}

.reset-button:hover,
.return-close:hover,
.modal-top .close:hover {
  background: #463344;
}

.modal-body {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  cursor: grab;
}

.modal-body:active {
  cursor: grabbing;
}

.modal-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transform-origin: center;
  user-select: none;
  pointer-events: none;
}

.modal-bottom {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 12px 16px;
}

.modal-nav {
  width: 45px;
  height: 40px;
  font-size: 22px;
}

.modal-help {
  font-size: 12px;
  color: #b59b86;
}

.footer {
  text-align: center;
  color: #a68b77;
  font-size: 11px;
  margin-top: 14px;
}

@media (min-width: 700px) {
  .gallery {
    padding: 16px;
  }

  .main-image {
    max-width: 540px;
    margin: auto;
  }

  .thumbs {
    justify-content: center;
  }
}

/* Croix de retour vers Notion */
a.return-close,
a.return-close:visited {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 26px;
  height: 26px;
  padding: 0;

  background: #30222e;
  color: #e8bb7e;
  border: 1px solid #94704e;
  border-radius: 6px;

  font-size: 16px;
  line-height: 1;
  text-decoration: none;
}

a.return-close:hover {
  background: #463344;
}
</style>
</head>

<body>

<main class="gallery">

  <div class="nav">
    <div class="nav-controls">
      <button id="prev" type="button"
        aria-label="Image précédente">❮</button>

      <span id="counter" class="counter">— / —</span>

      <button id="next" type="button"
        aria-label="Image suivante">❯</button>
    </div>

    <a id="returnArchive"
       class="return-close"
       href="#"
       aria-label="Retour à l'archive "
       title="Retour à l'archive">x</a>
  </div>

  <img
    id="mainImage"
    class="main-image"
    alt="Infographie des Archives des Veilles"
    draggable="false"
  >

  <p class="hint">
    Touchez l'image pour l'agrandir ·
    Glissez pour changer de page
  </p>

  <p id="loadStatus" class="hint" role="status">
    Chargement des images…
  </p>

  <div id="thumbs" class="thumbs"
       aria-label="Miniatures"></div>

  <div class="footer">
    © 2026 Les Archives des Veilles · Tous droits réservés
  </div>

</main>

<!-- Fenêtre d'agrandissement -->
<div
  id="modal"
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-label="Image agrandie"
  aria-hidden="true"
>

  <div class="modal-top">
    <span id="modalCounter">— / —</span>

    <button
      id="resetZoomButton"
      class="reset-button"
      type="button"
      title="Réinitialiser le zoom"
      aria-label="Réinitialiser le zoom">↺</button>

    <button
      id="close"
      class="close"
      type="button"
      aria-label="Fermer la vue agrandie">×</button>
  </div>

  <div id="modalBody" class="modal-body">
    <img
      id="modalImage"
      class="modal-image"
      alt="Image agrandie"
      draggable="false"
    >
  </div>

  <div class="modal-bottom">
    <button id="modalPrev" class="modal-nav"
      type="button" aria-label="Image précédente">❮</button>

    <span class="modal-help">
      Pincez ou utilisez la molette pour zoomer
    </span>

    <button id="modalNext" class="modal-nav"
      type="button" aria-label="Image suivante">❯</button>
  </div>

</div>

<script>

// Clé API Google Drive : conserver ta clé actuelle
const CLE_API = "AIzaSyCHfj7qDdgbXlpfDcWatMa8RwvgLb_EDx4";

// Archive demandée dans l'adresse
const parametres = new URLSearchParams(window.location.search);
const numeroArchive = parametres.get("archive") || "209";

// Informations chargées depuis archives.json
let DOSSIER_DRIVE = "";
let URL_ARCHIVE_NOTION = "";

async function chargerArchive() {
  try {
    const reponse = await fetch("./archives.json");

    if (!reponse.ok) {
      throw new Error("Impossible de charger archives.json");
    }

    const archives = await reponse.json();
    const archive = archives[numeroArchive];

    if (!archive) {
      throw new Error("Archive " + numeroArchive + " introuvable");
    }

    DOSSIER_DRIVE = archive.dossier;
    URL_ARCHIVE_NOTION = archive.notion;

    await loadPages();

  } catch (erreur) {
    setLoadStatus(erreur.message);
  }
}

let pages = [];

function imageUrl(id, size = 3200) {
  return "https://drive.google.com/thumbnail?id=" +
    encodeURIComponent(id) + "&sz=w" + size;
}

function setLoadStatus(message) {
  const el = document.getElementById("loadStatus");
  el.textContent = message;
  el.hidden = !message;
}

async function loadPages() {
  const params = new URLSearchParams({
    q: "'" + DOSSIER_DRIVE +
       "' in parents and trashed = false " +
       "and mimeType = 'image/png'",
    fields: "nextPageToken,files(id,name,mimeType)",
    pageSize: "100",
    key: CLE_API
  });

  try {
    const found = [];
    let token = "";

    do {
      if (token) params.set("pageToken", token);

      const response = await fetch(
        "https://www.googleapis.com/drive/v3/files?" +
        params
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error?.message ||
          "Erreur Google Drive " + response.status
        );
      }

      found.push(...(data.files || []));
      token = data.nextPageToken || "";

    } while (token);

    found.sort((a, b) =>
      a.name.localeCompare(
        b.name, "fr", { numeric: true }
      )
    );

    pages = found.map(file => ({
      name: file.name,
      src: imageUrl(file.id),
      thumbnail: imageUrl(file.id, 150)
    }));

    if (!pages.length) {
      setLoadStatus(
        "Aucune image PNG trouvée dans le dossier Publication."
      );
      return;
    }

    buildThumbnails();
    setLoadStatus("");
    render();

  } catch (error) {
    setLoadStatus(
      "Impossible de charger les images : " +
      error.message
    );
  }
}

let index = 0;
let scale = 1;
let tx = 0;
let ty = 0;

const $ = id => document.getElementById(id);
const modal = $("modal");
const body = $("modalBody");
const mimg = $("modalImage");

let thumbs = [];

function render() {
  if (!pages.length) return;

  const p = pages[index];

  $("mainImage").src = p.src;
  $("mainImage").alt = p.name;

  $("counter").textContent =
    `${index + 1} / ${pages.length}`;

  $("modalCounter").textContent =
    `${index + 1} / ${pages.length}`;

  mimg.src = p.src;
  mimg.alt = p.name;

  $("prev").disabled =
    $("modalPrev").disabled = index === 0;

  $("next").disabled =
    $("modalNext").disabled =
      index === pages.length - 1;

  thumbs.forEach((t, i) => {
    t.setAttribute(
      "aria-current", String(i === index)
    );
  });

  resetZoom();
}

function go(n) {
  if (!pages.length) return;

  index = Math.max(
    0,
    Math.min(pages.length - 1, index + n)
  );

  render();
}

function buildThumbnails() {
  $("thumbs").replaceChildren();
  thumbs = [];

  pages.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "thumb";
    b.type = "button";
    b.setAttribute("aria-label", p.name);

    const im = document.createElement("img");
    im.src = p.thumbnail;
    im.alt = "";
    im.loading = "lazy";

    b.append(im);

    b.onclick = () => {
      index = i;
      render();
    };

    $("thumbs").append(b);
    thumbs.push(b);
  });
}

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("modalPrev").onclick = () => go(-1);
$("modalNext").onclick = () => go(1);

function openModal() {
  if (!pages.length) return;

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  resetZoom();
  $("close").focus({ preventScroll: true });
}

function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";

  resetZoom();
}

$("mainImage").onclick = openModal;
$("close").onclick = closeModal;

document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      modal.classList.contains("open")) {
    closeModal();
  }

  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

// Glissement sur l'image principale
let start = null;
let suppressClick = false;

$("mainImage").addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    start = {
      x: e.touches[0].clientX,
      y: e.touches[0].clientY
    };
  }
}, { passive: true });

$("mainImage").addEventListener("touchend", e => {
  if (!start || !e.changedTouches.length) return;

  const dx =
    e.changedTouches[0].clientX - start.x;

  const dy =
    e.changedTouches[0].clientY - start.y;

  if (Math.abs(dx) > 55 &&
      Math.abs(dx) > Math.abs(dy) * 1.4) {
    go(dx < 0 ? 1 : -1);
    suppressClick = true;

    setTimeout(() => {
      suppressClick = false;
    }, 300);
  }

  start = null;
}, { passive: true });

$("mainImage").addEventListener("click", e => {
  if (suppressClick) {
    e.stopImmediatePropagation();
  }
}, true);

// Zoom dans la fenêtre agrandie
function transform() {
  mimg.style.transform =
    `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1;
  tx = 0;
  ty = 0;
  transform();
}

function zoom(factor) {
  scale = Math.max(
    1,
    Math.min(5, scale * factor)
  );

  if (scale === 1) {
    tx = 0;
    ty = 0;
  }

  transform();
}

body.addEventListener("wheel", e => {
  e.preventDefault();

  zoom(
    e.deltaY < 0 ? 1.2 : 1 / 1.2
  );
}, { passive: false });

// Zoom tactile et déplacement
const pointers = new Map();

let prevDist = null;
let prevMid = null;
let swipeX = null;
let swipeY = null;

function dist(a, b) {
  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}

function mid(a, b) {
  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };
}

body.addEventListener("pointerdown", e => {
  body.setPointerCapture(e.pointerId);

  pointers.set(e.pointerId, {
    x: e.clientX,
    y: e.clientY
  });

  if (pointers.size === 1) {
    swipeX = e.clientX;
    swipeY = e.clientY;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    prevDist = dist(a, b);
    prevMid = mid(a, b);
  }
});

body.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;

  const old = pointers.get(e.pointerId);

  pointers.set(e.pointerId, {
    x: e.clientX,
    y: e.clientY
  });

  if (pointers.size === 1 && scale > 1) {
    tx += e.clientX - old.x;
    ty += e.clientY - old.y;
    transform();

  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = dist(a, b);
    const m = mid(a, b);

    if (prevDist) {
      scale = Math.max(
        1,
        Math.min(5, scale * d / prevDist)
      );
    }

    if (prevMid) {
      tx += m.x - prevMid.x;
      ty += m.y - prevMid.y;
    }

    prevDist = d;
    prevMid = m;
    transform();
  }
});

function pointerEnd(e) {
  if (pointers.size === 1 &&
      scale === 1 &&
      swipeX !== null) {

    const dx = e.clientX - swipeX;
    const dy = e.clientY - swipeY;

    if (Math.abs(dx) > 60 &&
        Math.abs(dx) > Math.abs(dy) * 1.4) {
      go(dx < 0 ? 1 : -1);
    }
  }

  pointers.delete(e.pointerId);

  if (!pointers.size) {
    prevDist = null;
    prevMid = null;
    swipeX = null;
    swipeY = null;
  }
}

body.addEventListener("pointerup", pointerEnd);
body.addEventListener("pointercancel", pointerEnd);

// Retour vers Notion
$("returnArchive").href = URL_ARCHIVE_NOTION;

// Bouton de réinitialisation du zoom
$("resetZoomButton").addEventListener(
  "click",
  resetZoom
);

// Chargement des illustrations
chargerArchive();

</script>
</body>
</html>
