
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visionneuse interactive — Les Archives des Veilles</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #171119;
  color: #f5e5cb;
  font-family: Georgia, serif;
}

.viewer {
  max-width: 850px;
  margin: auto;
  padding: 14px;
}

/* En-tête */
.heading {
  text-align: center;
  padding: 14px 10px 12px;
  margin-bottom: 12px;
  background: #1e1520;
  border-radius: 10px;
}

.heading h1 {
  margin: 0;
  color: #e8bb7e;
  font-size: clamp(15px, 2.7vw, 20px);
  font-weight: normal;
  text-shadow: 0 0 8px rgba(232, 187, 126, 0.18);
}

.heading .separator {
  height: 1px;
  background: linear-gradient(
    to right,
    transparent,
    #94704e,
    transparent
  );
  margin: 13px 0 10px;
}

.heading .signature {
  margin: 0;
  color: #f5e5cb;
  font-size: 11px;
}

/* Zone de lecture */
.stage {
  height: min(75vh, 750px);
  min-height: 320px;
  background: #0e0b10;
  border: 1px solid #70533e;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  touch-action: pan-y;
  cursor: grab;
}

.stage:active {
  cursor: grabbing;
}

.artwork {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  transform-origin: center center;
  user-select: none;
}

.artwork img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.status {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  font: 13px/1.5 Arial, sans-serif;
  color: #d7bfaa;
  background: #0e0b10;
}

.status[hidden] {
  display: none;
}

/* Commandes sur deux rangées */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 11px;
}

.control-row {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: center;
  gap: 9px;
  width: 100%;
}

.control-row button {
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  min-width: 0;
  padding: 0;
  display: inline-flex;
  justify-content: center;
  align-items: center;
}

button {
  background: #30222e;
  color: #f5e5cb;
  border: 1px solid #94704e;
  border-radius: 7px;
  cursor: pointer;
  font: 14px Arial, sans-serif;
}

button:hover {
  background: #51384a;
}

button:focus-visible {
  outline: 2px solid #e8bb7e;
  outline-offset: 2px;
}

button:disabled {
  opacity: .35;
  cursor: default;
}

#counter {
  min-width: 58px;
  text-align: center;
  font: 13px Arial, sans-serif;
}

/* Miniatures */
.thumbnails {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 12px 2px 5px;
  scrollbar-width: thin;
  justify-content: flex-start;
}

.thumb {
  flex: 0 0 auto;
  width: 48px;
  height: 67px;
  border: 1px solid #70533e;
  border-radius: 5px;
  padding: 2px;
  background: #241a25;
  opacity: .68;
  overflow: hidden;
}

.thumb[aria-current="true"] {
  border: 2px solid #e8bb7e;
  opacity: 1;
}

.thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.copyright {
  margin: 13px 0 0;
  text-align: center;
  color: #a68b77;
  font: 11px Arial, sans-serif;
}

/* Plein écran */
const fullscreenButton = document.getElementById("fullscreen");

function updateFullscreenButton() {
  const isFullscreen = document.fullscreenElement === viewer;

  fullscreenButton.textContent = isFullscreen ? "⊟" : "⛶";
  fullscreenButton.title = isFullscreen
    ? "Quitter le plein écran"
    : "Passer en plein écran";

  fullscreenButton.setAttribute(
    "aria-label",
    fullscreenButton.title
  );
}

fullscreenButton.onclick = async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await viewer.requestFullscreen();
    }
  } catch (error) {
    alert(
      "Le plein écran n'est pas disponible dans cet affichage."
    );
  }
};

document.addEventListener(
  "fullscreenchange",
  updateFullscreenButton
);

updateFullscreenButton();

/* Adaptation mobile */
@media (max-width: 600px) {
  .viewer {
    padding: 8px;
  }

  .stage {
    height: 65vh;
    min-height: 260px;
  }

  .heading {
    padding: 12px 8px;
  }

  .heading h1 {
    font-size: 16px;
  }

  .control-row button {
    flex-basis: 40px;
    width: 40px;
    height: 40px;
  }

  .thumb {
    width: 42px;
    height: 59px;
  }
}
</style>
</head>

<body>

<main class="viewer" id="viewer">

  <header class="heading">
    <h1>☽ Visionneuse interactive ☾</h1>
    <div class="separator"></div>
    <p class="signature">Les Archives des Veilles</p>
  </header>

  <div class="stage" id="stage"
       aria-label="Infographie, zoom et navigation tactile">

    <div class="artwork" id="artwork">
      <img
        id="image"
        alt="Infographie des Archives des Veilles"
        draggable="false"
      >
    </div>

    <div class="status" id="status" role="status">
      Chargement des infographies…
    </div>

  </div>

  <nav class="controls" aria-label="Commandes de la visionneuse">

    <div class="control-row">
      <button id="prev" title="Précédente"
              aria-label="Image précédente">❮</button>

      <span id="counter" aria-live="polite">— / —</span>

      <button id="next" title="Suivante"
              aria-label="Image suivante">❯</button>
    </div>

    <div class="control-row">
      <button id="minus" title="Dézoomer"
              aria-label="Dézoomer">−</button>

      <button id="plus" title="Zoomer"
              aria-label="Zoomer">+</button>

      <button id="reset" title="Réinitialiser le zoom"
              aria-label="Réinitialiser le zoom">↺</button>

      <button id="fullscreen" title="Plein écran"
              aria-label="Plein écran">⛶</button>
    </div>

  </nav>

  <div class="thumbnails" id="thumbnails"
       aria-label="Miniatures des infographies"></div>

  <p class="copyright">
    © 2026 Les Archives des Veilles · Tous droits réservés
  </p>

</main>

<script>

// Dossier Google Drive actuellement utilisé pour le test
const DOSSIER_DRIVE = "1QioBxBkKRLPrbMLn2xqJhfcbVw_fuhsZ";

// Clé API restreinte à Google Drive API et GitHub Pages
const CLE_API = "AIzaSyCHfj7qDdgbXlpfDcWatMa8RwvgLb_EDx4";

const stage = document.getElementById("stage");
const artwork = document.getElementById("artwork");
const viewer = document.getElementById("viewer");
const imageElement = document.getElementById("image");
const statusElement = document.getElementById("status");
const thumbnailsElement = document.getElementById("thumbnails");

let pages = [];
let index = 0;
let scale = 1;
let x = 0;
let y = 0;

let pointers = new Map();
let previousDistance = null;
let previousCenter = null;
let swipeStartX = null;
let swipeStartY = null;
let swipePossible = false;

function imageUrl(id) {
  return "https://drive.google.com/thumbnail?id=" +
    encodeURIComponent(id) + "&sz=w3200";
}

function setStatus(message) {
  statusElement.textContent = message;
  statusElement.hidden = !message;
}

function applyTransform() {
  artwork.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1;
  x = 0;
  y = 0;
  applyTransform();
}

function zoom(factor) {
  scale = Math.max(1, Math.min(8, scale * factor));

  if (scale === 1) {
    x = 0;
    y = 0;
  }

  applyTransform();
}

function render() {
  if (!pages.length) return;

  const page = pages[index];

  resetZoom();
  setStatus("Chargement de " + page.name + "…");

  imageElement.onload = () => setStatus("");

  imageElement.onerror = () => {
    setStatus(
      "Impossible d'afficher " + page.name +
      ". Vérifiez le partage Google Drive."
    );
  };

  imageElement.alt = page.name === "00.png"
    ? "Image de synthèse — Les Archives des Veilles"
    : "Infographie " + page.name;

  imageElement.src = imageUrl(page.id);

  document.getElementById("counter").textContent =
    `${index + 1} / ${pages.length}`;

  document.getElementById("prev").disabled = index === 0;

  document.getElementById("next").disabled =
    index === pages.length - 1;

  [...thumbnailsElement.children].forEach((button, i) => {
    button.setAttribute("aria-current", String(i === index));
  });
}

function buildThumbnails() {
  thumbnailsElement.replaceChildren();

  pages.forEach((page, i) => {
    const button = document.createElement("button");

    button.className = "thumb";
    button.type = "button";

    button.title = page.name === "00.png"
      ? "Image de synthèse"
      : "Planche " + page.name;

    button.setAttribute("aria-label", button.title);

    const img = document.createElement("img");

    img.src =
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(page.id) +
      "&sz=w150";

    img.alt = "";
    img.loading = "lazy";

    button.appendChild(img);

    button.onclick = () => {
      index = i;
      render();
    };

    thumbnailsElement.appendChild(button);
  });
}

async function loadPages() {

  if (CLE_API.startsWith("REMPLACER_")) {
    setStatus(
      "Configuration nécessaire : renseigner la clé API " +
      "Google Drive restreinte dans le code."
    );
    return;
  }

  const params = new URLSearchParams({
    q: "'" + DOSSIER_DRIVE +
       "' in parents and trashed = false " +
       "and mimeType = 'image/png'",
    fields: "nextPageToken,files(id,name,mimeType)",
    pageSize: "100",
    key: CLE_API
  });

  try {
    let token = "";

    do {
      if (token) {
        params.set("pageToken", token);
      }

      const response = await fetch(
        "https://www.googleapis.com/drive/v3/files?" + params
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error?.message ||
          "Erreur Google Drive " + response.status
        );
      }

      pages.push(...(data.files || []));

      token = data.nextPageToken || "";

    } while (token);

    pages.sort((a, b) =>
      a.name.localeCompare(b.name, "fr", { numeric: true })
    );

    if (!pages.length) {
      setStatus(
        "Aucune image PNG trouvée dans le dossier Publication."
      );
      return;
    }

    buildThumbnails();
    render();

  } catch (error) {
    setStatus(
      "Impossible de charger les images : " + error.message
    );
  }
}

// Navigation
document.getElementById("prev").onclick = () => {
  if (index > 0) {
    index--;
    render();
  }
};

document.getElementById("next").onclick = () => {
  if (index < pages.length - 1) {
    index++;
    render();
  }
};

// Zoom
document.getElementById("plus").onclick = () => zoom(1.4);
document.getElementById("minus").onclick = () => zoom(1 / 1.4);
document.getElementById("reset").onclick = resetZoom;

// Plein écran
document.getElementById("fullscreen").onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (viewer.requestFullscreen) {
    viewer.requestFullscreen().catch(() => {
      setStatus(
        "Le plein écran n'est pas autorisé ici. " +
        "Ouvrez la visionneuse dans un nouvel onglet."
      );
    });
  }
};

// Molette
stage.addEventListener("wheel", event => {
  event.preventDefault();
  zoom(event.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

function distance(a, b) {
  return Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );
}

function center(a, b) {
  return {
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2
  };
}

// Gestes tactiles
stage.addEventListener("pointerdown", event => {
  stage.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, event);

  if (pointers.size === 1 && scale === 1) {
    swipeStartX = event.clientX;
    swipeStartY = event.clientY;
    swipePossible = true;
  }

  if (pointers.size > 1) {
    swipePossible = false;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    previousDistance = distance(a, b);
    previousCenter = center(a, b);
  }
});

stage.addEventListener("pointermove", event => {
  if (!pointers.has(event.pointerId)) return;

  const old = pointers.get(event.pointerId);
  pointers.set(event.pointerId, event);

  if (pointers.size === 1 && scale > 1) {
    x += event.clientX - old.clientX;
    y += event.clientY - old.clientY;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const newDistance = distance(a, b);
    const newCenter = center(a, b);

    if (previousDistance) {
      scale = Math.max(
        1,
        Math.min(8, scale * newDistance / previousDistance)
      );
    }

    if (previousCenter) {
      x += newCenter.x - previousCenter.x;
      y += newCenter.y - previousCenter.y;
    }

    previousDistance = newDistance;
    previousCenter = newCenter;
  }

  if (scale === 1) {
    x = 0;
    y = 0;
  }

  applyTransform();
});

function endPointer(event) {
  if (
    swipePossible &&
    pointers.size === 1 &&
    scale === 1 &&
    swipeStartX !== null
  ) {
    const dx = event.clientX - swipeStartX;
    const dy = event.clientY - swipeStartY;

    if (
      Math.abs(dx) > 60 &&
      Math.abs(dx) > Math.abs(dy) * 1.5
    ) {
      if (dx < 0 && index < pages.length - 1) {
        index++;
        render();
      } else if (dx > 0 && index > 0) {
        index--;
        render();
      }
    }
  }

  pointers.delete(event.pointerId);
  swipePossible = false;
  swipeStartX = null;
  swipeStartY = null;
  previousDistance = null;
  previousCenter = null;

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    previousDistance = distance(a, b);
    previousCenter = center(a, b);
  }
}

stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

loadPages();

</script>
</body>
</html>
