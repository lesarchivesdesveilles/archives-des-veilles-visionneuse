
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visionneuse interactive — Les Archives des Veilles</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #171119;
  color: #f5e5cb;
  font-family: Georgia, serif;
}

.viewer {
  max-width: 850px;
  margin: auto;
  padding: 14px;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.heading h1 {
  margin: 0;
  font-size: clamp(14px, 2.8vw, 19px);
  color: #e8bb7e;
  font-weight: normal;
}

.heading .brand {
  color: #c5b6be;
  font: 11px Arial, sans-serif;
  white-space: nowrap;
}

.stage {
  height: min(75vh, 750px);
  min-height: 320px;
  background: #0e0b10;
  border: 1px solid #70533e;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  touch-action: pan-y;
  cursor: grab;
}

.stage:active {
  cursor: grabbing;
}

.artwork {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  transform-origin: center center;
  user-select: none;
}

.artwork img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.status {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  font: 13px/1.5 Arial, sans-serif;
  color: #d7bfaa;
  background: #0e0b10;
}

.status[hidden] {
  display: none;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

.control-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  width: 100%;
}

.control-row button {
  width: 42px;
  height: 42px;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.controls {
  flex-direction: column;
  gap: 9px;
}

button {
  background: #30222e;
  color: #f5e5cb;
  border: 1px solid #94704e;
  border-radius: 7px;
  padding: 9px 12px;
  cursor: pointer;
  font: 14px Arial, sans-serif;
  min-width: 39px;
}

button:hover {
  background: #51384a;
}

button:focus-visible,
.thumb:focus-visible {
  outline: 2px solid #e8bb7e;
  outline-offset: 2px;
}

button:disabled {
  opacity: .35;
  cursor: default;
}

#counter {
  min-width: 58px;
  text-align: center;
  font: 13px Arial, sans-serif;
}

.thumbnails {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 12px 2px 5px;
  scrollbar-width: thin;
  justify-content: safe center;
}

.thumb {
  flex: 0 0 auto;
  width: 48px;
  height: 67px;
  border: 1px solid #70533e;
  border-radius: 5px;
  padding: 2px;
  background: #241a25;
  opacity: .68;
  overflow: hidden;
}

.thumb[aria-current="true"] {
  border: 2px solid #e8bb7e;
  opacity: 1;
}

.thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.copyright {
  margin: 13px 0 0;
  text-align: center;
  color: #a68b77;
  font: 11px Arial, sans-serif;
}

.viewer:fullscreen {
  background: #171119;
  max-width: none;
  display: flex;
  flex-direction: column;
}

.viewer:fullscreen .stage {
  flex: 1;
  min-height: 0;
  height: auto;
}

@media (max-width: 600px) {
  .viewer {
    padding: 8px;
  }

  .stage {
    height: 65vh;
    min-height: 260px;
  }

  .heading .brand {
    display: none;
  }

  button {
    padding: 9px;
  }

  .thumb {
    width: 42px;
    height: 59px;
  }
}
</style>
</head>

<body>

<main class="viewer" id="viewer">

  <div class="heading">
    <h1>✦ Visionneuse interactive — Les Archives des Veilles</h1>
    <span class="brand">LADV</span>
  </div>

  <div class="stage" id="stage"
       aria-label="Infographie, zoom et navigation tactile">

    <div class="artwork" id="artwork">
      <img
        id="image"
        alt="Infographie des Archives des Veilles"
        draggable="false"
      >
    </div>

    <div class="status" id="status" role="status">
      Chargement des infographies…
    </div>

  </div>

  <nav class="controls" aria-label="Commandes de la visionneuse">

  <div class="control-row">
    <button id="prev" title="Précédente"
            aria-label="Image précédente">❮</button>

    <span id="counter" aria-live="polite">— / —</span>

    <button id="next" title="Suivante"
            aria-label="Image suivante">❯</button>
  </div>

  <div class="control-row">
    <button id="minus" title="Dézoomer"
            aria-label="Dézoomer">−</button>

    <button id="plus" title="Zoomer"
            aria-label="Zoomer">+</button>

    <button id="reset" title="Réinitialiser le zoom"
            aria-label="Réinitialiser le zoom">↺</button>

    <button id="fullscreen" title="Plein écran"
            aria-label="Plein écran">⛶</button>
  </div>
</nav>

  <div class="thumbnails" id="thumbnails"
       aria-label="Miniatures des infographies"></div>

  <p class="copyright">
    © 2026 Les Archives des Veilles · Tous droits réservés
  </p>

</main>

<script>

// Dossier Google Drive « Publication » du Livre d'Énoch
const DOSSIER_DRIVE = "1QioBxBkKRLPrbMLn2xqJhfcbVw_fuhsZ";

// Utiliser uniquement une clé restreinte à Google Drive API
// et au domaine GitHub Pages.
const CLE_API = "AIzaSyCHfj7qDdgbXlpfDcWatMa8RwvgLb_EDx4";

const stage = document.getElementById("stage");
const artwork = document.getElementById("artwork");
const viewer = document.getElementById("viewer");
const imageElement = document.getElementById("image");
const statusElement = document.getElementById("status");
const thumbnailsElement = document.getElementById("thumbnails");

let pages = [];
let index = 0;
let scale = 1;
let x = 0;
let y = 0;

let pointers = new Map();
let previousDistance = null;
let previousCenter = null;
let swipeStartX = null;
let swipeStartY = null;
let swipePossible = false;

// Adresse de l'image Google Drive
function imageUrl(id) {
  return "https://drive.google.com/thumbnail?id=" +
    encodeURIComponent(id) + "&sz=w3200";
}

// Messages de chargement
function setStatus(message) {
  statusElement.textContent = message;
  statusElement.hidden = !message;
}

// Déplacement et zoom
function applyTransform() {
  artwork.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1;
  x = 0;
  y = 0;
  applyTransform();
}

function zoom(factor) {
  scale = Math.max(1, Math.min(8, scale * factor));

  if (scale === 1) {
    x = 0;
    y = 0;
  }

  applyTransform();
}

// Affichage d'une planche
function render() {
  if (!pages.length) return;

  const page = pages[index];

  resetZoom();
  setStatus("Chargement de " + page.name + "…");

  imageElement.onload = () => setStatus("");

  imageElement.onerror = () => {
    setStatus(
      "Impossible d'afficher " + page.name +
      ". Vérifiez le partage Google Drive."
    );
  };

  imageElement.alt = page.name === "00.png"
    ? "Image de synthèse — Les Archives des Veilles"
    : "Infographie " + page.name;

  imageElement.src = imageUrl(page.id);

  document.getElementById("counter").textContent =
    `${index + 1} / ${pages.length}`;

  document.getElementById("prev").disabled = index === 0;

  document.getElementById("next").disabled =
    index === pages.length - 1;

  [...thumbnailsElement.children].forEach((button, i) => {
    button.setAttribute("aria-current", String(i === index));
  });
}

// Miniatures cliquables
function buildThumbnails() {
  thumbnailsElement.replaceChildren();

  pages.forEach((page, i) => {
    const button = document.createElement("button");

    button.className = "thumb";
    button.type = "button";

    button.title = page.name === "00.png"
      ? "Image de synthèse"
      : "Planche " + page.name;

    button.setAttribute("aria-label", button.title);

    const img = document.createElement("img");

    img.src =
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(page.id) +
      "&sz=w150";

    img.alt = "";
    img.loading = "lazy";

    button.appendChild(img);

    button.onclick = () => {
      index = i;
      render();
    };

    thumbnailsElement.appendChild(button);
  });
}

// Récupération automatique des images
async function loadPages() {

  if (CLE_API.startsWith("REMPLACER_")) {
    setStatus(
      "Configuration nécessaire : renseigner la clé API " +
      "Google Drive restreinte dans le code."
    );
    return;
  }

  const params = new URLSearchParams({
    q: "'" + DOSSIER_DRIVE +
       "' in parents and trashed = false " +
       "and mimeType = 'image/png'",
    fields: "nextPageToken,files(id,name,mimeType)",
    pageSize: "100",
    key: CLE_API
  });

  try {
    let token = "";

    do {
      if (token) {
        params.set("pageToken", token);
      }

      const response = await fetch(
        "https://www.googleapis.com/drive/v3/files?" + params
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error?.message ||
          "Erreur Google Drive " + response.status
        );
      }

      pages.push(...(data.files || []));

      token = data.nextPageToken || "";

    } while (token);

    // Tri automatique : 00, 01, 02...
    pages.sort((a, b) =>
      a.name.localeCompare(b.name, "fr", { numeric: true })
    );

    if (!pages.length) {
      setStatus(
        "Aucune image PNG trouvée dans le dossier Publication."
      );
      return;
    }

    buildThumbnails();
    render();

  } catch (error) {
    setStatus(
      "Impossible de charger les images : " + error.message
    );
  }
}

// Boutons de navigation
document.getElementById("prev").onclick = () => {
  if (index > 0) {
    index--;
    render();
  }
};

document.getElementById("next").onclick = () => {
  if (index < pages.length - 1) {
    index++;
    render();
  }
};

// Boutons de zoom
document.getElementById("plus").onclick = () => zoom(1.4);
document.getElementById("minus").onclick = () => zoom(1 / 1.4);
document.getElementById("reset").onclick = resetZoom;

// Plein écran
document.getElementById("fullscreen").onclick = () => {

  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (viewer.requestFullscreen) {
    viewer.requestFullscreen().catch(() => {
      setStatus(
        "Le plein écran n'est pas autorisé ici. " +
        "Ouvrez la visionneuse dans un nouvel onglet."
      );
    });
  }

};

// Zoom à la molette
stage.addEventListener("wheel", event => {
  event.preventDefault();
  zoom(event.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

// Calcul de la distance entre deux doigts
function distance(a, b) {
  return Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );
}

function center(a, b) {
  return {
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2
  };
}

// Début du toucher
stage.addEventListener("pointerdown", event => {

  stage.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, event);

  if (pointers.size === 1 && scale === 1) {
    swipeStartX = event.clientX;
    swipeStartY = event.clientY;
    swipePossible = true;
  }

  if (pointers.size > 1) {
    swipePossible = false;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    previousDistance = distance(a, b);
    previousCenter = center(a, b);
  }

});

// Déplacement tactile
stage.addEventListener("pointermove", event => {

  if (!pointers.has(event.pointerId)) return;

  const old = pointers.get(event.pointerId);
  pointers.set(event.pointerId, event);

  if (pointers.size === 1 && scale > 1) {
    x += event.clientX - old.clientX;
    y += event.clientY - old.clientY;
  }

  if (pointers.size === 2) {

    const [a, b] = [...pointers.values()];

    const newDistance = distance(a, b);
    const newCenter = center(a, b);

    if (previousDistance) {
      scale = Math.max(
        1,
        Math.min(
          8,
          scale * newDistance / previousDistance
        )
      );
    }

    if (previousCenter) {
      x += newCenter.x - previousCenter.x;
      y += newCenter.y - previousCenter.y;
    }

    previousDistance = newDistance;
    previousCenter = newCenter;
  }

  if (scale === 1) {
    x = 0;
    y = 0;
  }

  applyTransform();

});

// Fin du toucher et balayage horizontal
function endPointer(event) {

  if (
    swipePossible &&
    pointers.size === 1 &&
    scale === 1 &&
    swipeStartX !== null
  ) {

    const dx = event.clientX - swipeStartX;
    const dy = event.clientY - swipeStartY;

    if (
      Math.abs(dx) > 60 &&
      Math.abs(dx) > Math.abs(dy) * 1.5
    ) {

      if (dx < 0 && index < pages.length - 1) {
        index++;
        render();
      } else if (dx > 0 && index > 0) {
        index--;
        render();
      }

    }
  }

  pointers.delete(event.pointerId);

  swipePossible = false;
  swipeStartX = null;
  swipeStartY = null;
  previousDistance = null;
  previousCenter = null;

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    previousDistance = distance(a, b);
    previousCenter = center(a, b);
  }

}

stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

// Démarrage
loadPages();

</script>
</body>
</html>
