
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Archives des Veilles — Visionneuse</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #171119;
    color: #f5e5cb;
    font-family: Georgia, serif;
  }

  .viewer {
    max-width: 850px;
    margin: auto;
    padding: 16px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  header strong { color: #e8bb7e; }
  header span { font-size: 13px; }

  .stage {
    height: min(75vh, 750px);
    min-height: 350px;
    background: #0e0b10;
    border: 1px solid #70533e;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    touch-action: none;
    cursor: grab;
  }

  .stage:active { cursor: grabbing; }

  .artwork {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-origin: center center;
    user-select: none;
  }

  .sheet {
    width: min(65%, 360px);
    aspect-ratio: 2 / 3;
    padding: 10%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 22px;
    border: 5px double #e4b77e;
    background:
      radial-gradient(circle at 50% 30%, #665075, #241629 75%);
    box-shadow: 0 0 35px #000;
  }

  .sheet .symbol { font-size: 64px; }
  .sheet h2 { font-size: clamp(18px, 3vw, 28px); }
  .sheet p { line-height: 1.6; }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 12px;
  }

  button {
    background: #30222e;
    color: #f5e5cb;
    border: 1px solid #94704e;
    border-radius: 7px;
    padding: 11px 15px;
    cursor: pointer;
  }

  button:hover { background: #51384a; }
  button:disabled { opacity: .4; cursor: default; }

  #counter { min-width: 52px; text-align: center; }

  .help {
    text-align: center;
    font: 12px Arial, sans-serif;
    opacity: .75;
    line-height: 1.7;
    margin-top: 12px;
  }

  @media (max-width: 600px) {
    .viewer { padding: 8px; }
    .stage { height: 68vh; }
    .sheet { width: 75%; padding: 8%; }
    .sheet .symbol { font-size: 42px; }
    .sheet p { font-size: 12px; }
    button { padding: 10px; }
  }

 .artwork img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
 }
 
</style>
</head>
<body>

<main class="viewer" id="viewer">
    <div class="stage" id="stage">
    <div class="artwork" id="artwork">
  <img id="image" alt="Infographie des Archives des Veilles"
       draggable="false">
</div>
  </div>

  <div class="controls">
    <button id="prev">← Précédente</button>
    <span id="counter">1 / 3</span>
    <button id="next">Suivante →</button>
    <button id="minus">−</button>
    <button id="plus">+</button>
    <button id="reset">Réinitialiser</button>
    <button id="fullscreen">⛶ Plein écran</button>
  </div>
</main>

<script>
const pages = [
    {
    image: "archives/209/1%20b.png",
    title: "Le livre d'Énoch — Planche 1"
  },
  {
    image: "archives/209/2%20a.png",
    title: "Le livre d'Énoch — Planche 2"
  },
  {
    image: "archives/209/3%20a.png",
    title: "Le livre d'Énoch — Planche 3"
  }
];

const stage = document.getElementById("stage");
const artwork = document.getElementById("artwork");
const viewer = document.getElementById("viewer");

let index = 0;
let scale = 1;
let x = 0, y = 0;
let pointers = new Map();
let previousDistance = null;
let previousCenter = null;
let swipeStartX = null;
let swipeStartY = null;
let swipePossible = false;

function render() {
  const page = pages[index];
  const image = document.getElementById("image");

  image.src = page.image;
  image.alt = page.title;

  document.getElementById("counter").textContent =
    `${index + 1} / ${pages.length}`;

  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled =
    index === pages.length - 1;

  resetZoom();
}

function applyTransform() {
  artwork.style.transform =
    `translate(${x}px, ${y}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1;
  x = 0;
  y = 0;
  applyTransform();
}

function zoom(factor) {
  scale = Math.max(1, Math.min(8, scale * factor));
  if (scale === 1) {
    x = 0;
    y = 0;
  }
  applyTransform();
}

document.getElementById("prev").onclick = () => {
  if (index > 0) {
    index--;
    render();
  }
};

document.getElementById("next").onclick = () => {
  if (index < pages.length - 1) {
    index++;
    render();
  }
};

document.getElementById("plus").onclick = () => zoom(1.4);
document.getElementById("minus").onclick = () => zoom(1 / 1.4);
document.getElementById("reset").onclick = resetZoom;

document.getElementById("fullscreen").onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (viewer.requestFullscreen) {
    viewer.requestFullscreen();
  }
};

stage.addEventListener("wheel", event => {
  event.preventDefault();
  zoom(event.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

function distance(a, b) {
  return Math.hypot(a.clientX - b.clientX,
                    a.clientY - b.clientY);
}

function center(a, b) {
  return {
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2
  };
}

stage.addEventListener("pointerdown", event => {
  stage.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, event);

 if (pointers.size === 1 && scale === 1) {
    swipeStartX = event.clientX;
    swipeStartY = event.clientY;
    swipePossible = true;
  }

  if (pointers.size > 1) {
    swipePossible = false;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    previousDistance = distance(a, b);
    previousCenter = center(a, b);
  }
});

stage.addEventListener("pointermove", event => {
  if (!pointers.has(event.pointerId)) return;

  const old = pointers.get(event.pointerId);
  pointers.set(event.pointerId, event);

  if (pointers.size === 1 && scale > 1) {
    x += event.clientX - old.clientX;
    y += event.clientY - old.clientY;
  }

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const newDistance = distance(a, b);
    const newCenter = center(a, b);

    if (previousDistance) {
      scale = Math.max(1, Math.min(8,
        scale * newDistance / previousDistance));
    }

    if (previousCenter) {
      x += newCenter.x - previousCenter.x;
      y += newCenter.y - previousCenter.y;
    }

    previousDistance = newDistance;
    previousCenter = newCenter;
  }

  if (scale === 1) {
    x = 0;
    y = 0;
  }

  applyTransform();
});

function endPointer(event) {
  if (
    swipePossible &&
    pointers.size === 1 &&
    scale === 1 &&
    swipeStartX !== null
  ) {
    const dx = event.clientX - swipeStartX;
    const dy = event.clientY - swipeStartY;

    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && index < pages.length - 1) {
        index++;
        render();
      } else if (dx > 0 && index > 0) {
        index--;
        render();
      }
    }
  }

  pointers.delete(event.pointerId);
  swipePossible = false;
  swipeStartX = null;
  swipeStartY = null;
  previousDistance = null;
  previousCenter = null;

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    previousDistance = distance(a, b);
    previousCenter = center(a, b);
  }
}

stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

render();
</script>
</body>
</html>
